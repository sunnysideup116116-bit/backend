<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Real Time Chat Support Demo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Control Panel for Demo Purposes -->
        <aside class="control-panel">
            <h2>Demo Controls</h2>
            <div class="control-group">
                <label for="chat-selector">Select Scenario:</label>
                <select id="chat-selector">
                    <option value="smooth">Smooth Chat</option>
                    <option value="struggling">Struggling Chat</option>
                    <option value="neutral">Neutral Chat</option>
                </select>
            </div>
            
            <div class="control-actions">
                <button id="btn-progress" class="btn primary">Progress Chat</button>
                <button id="btn-reset" class="btn secondary">Reset</button>
            </div>
            
            <div class="state-indicator">
                <h3>Current Scenario Data</h3>
                <p>Messages: <span id="msg-count">0</span> / <span id="total-msgs">0</span></p>
                <p>AI Role: <span id="ai-role" class="badge">N/A</span></p>
            </div>
        </aside>

        <!-- Main Chat Interface -->
        <main class="chat-wrapper">
            <div class="chat-container glass-effect">
                <header class="chat-header">
                    <div class="avatar"></div>
                    <div class="user-info">
                        <h2>Alex (User B)</h2>
                        <span class="status">Online</span>
                    </div>
                </header>
                
                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be injected here by JS -->
                </div>
                
                <div class="chat-input-area">
                    <div class="ai-suggestion-zone" id="ai-suggestion-zone">
                        <!-- AI UI will appear here -->
                    </div>
                    <div class="input-wrapper">
                        <button id="btn-ai-help" class="btn-ai" title="Help me reply">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>
                            <span class="btn-ai-text">Need help replying?</span>
                        </button>
                        <input type="text" placeholder="Type a message..." readonly>
                        <button class="btn-send">
                            <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
